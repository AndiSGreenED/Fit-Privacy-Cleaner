<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Fit Privacy Cleaner</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:'Segoe UI',sans-serif;

    background:
    radial-gradient(circle at top right,#4fd1d9,#0f4961);

    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.card{
    background:white;
    width:100%;
    max-width:1000px;

    border-radius:28px;

    padding:40px;

    box-shadow:
    0 20px 80px rgba(0,0,0,.25);
}

.logo{
    height:120px;
    display:block;
    margin:auto;
}

h1{
    text-align:center;
    color:#0f4961;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#64748b;
    margin-bottom:35px;
}

.dropzone{

    border:4px dashed #2ec4c6;

    border-radius:25px;

    min-height:240px;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    cursor:pointer;

    transition:.25s;

    background:#f6ffff;
}

.dropzone:hover{

    transform:translateY(-3px);

    background:#ebffff;
}

.drag{
    background:#cffafe;
}

.big{

    font-size:70px;
}

.info{

    margin-top:25px;

    padding:20px;

    border-radius:15px;

    background:#f8fafc;
}

.button{

    background:#0f766e;

    border:none;

    padding:16px 40px;

    border-radius:15px;

    color:white;

    font-size:16px;

    cursor:pointer;

    margin-top:25px;

    display:block;

    width:100%;
}

.button:hover{
    background:#115e59;
}

.button:disabled{

    background:#94a3b8;
    cursor:not-allowed;
}

.result{

    margin-top:25px;

    padding:20px;

    border-radius:14px;

    background:#f0fdf4;
}

.badge{

    display:inline-block;

    background:#ccfbf1;

    color:#0f766e;

    padding:8px 12px;

    border-radius:20px;

    margin:5px;
}
</style>
</head>

<body>

<div class="card">

<img src="SurfsApp_Symbol_1.png" class="logo">

<h1>Fit Privacy Cleaner</h1>

<div class="subtitle">
Share your FIT files, not your private data.
</div>

<div id="dropzone" class="dropzone">

<div class="big">🏄</div>

<h2>FIT-Datei hier ablegen</h2>

<p>oder zum Auswählen klicken</p>

</div>

<input
id="file"
type="file"
accept=".fit"
hidden>

<div id="info" class="info">
Noch keine Datei ausgewählt.
</div>

<button
id="analyzeBtn"
disabled
class="button">

Analyse starten
</button>

<div id="result"></div>

</div>

<script>

const fileInput =
document.getElementById("file");

const dropzone =
document.getElementById("dropzone");

const info =
document.getElementById("info");

const result =
document.getElementById("result");

const analyzeBtn =
document.getElementById("analyzeBtn");

dropzone.onclick = () => {
    fileInput.click();
};

fileInput.addEventListener(
"change",
showFile
);

dropzone.addEventListener(
"dragover",
(e)=>{
e.preventDefault();
dropzone.classList.add("drag");
}
);

dropzone.addEventListener(
"dragleave",
()=>{
dropzone.classList.remove("drag");
}
);

dropzone.addEventListener(
"drop",
(e)=>{

e.preventDefault();

dropzone.classList.remove("drag");

if(e.dataTransfer.files.length){

fileInput.files =
e.dataTransfer.files;

showFile();
}
}
);

function showFile(){

const file =
fileInput.files[0];

if(!file) return;

info.innerHTML = `
<b>Datei:</b>
${file.name}
<br>
<b>Größe:</b>
${(file.size / 1024).toFixed(1)} KB
`;

analyzeBtn.disabled = false;
}

analyzeBtn.addEventListener(
"click",
async ()=>{

const file =
fileInput.files[0];

if(!file) return;

const formData =
new FormData();

formData.append(
"file",
file
);

result.innerHTML =
"Analysiere...";

try{

const response =
await fetch(
"http://127.0.0.1:8000/analyze",
{
method:"POST",
body:formData
});

const data =
await response.json();

result.innerHTML = `
<div class="result">

<h3>Analyse erfolgreich</h3>

<div class="badge">
📄 ${data.filename}
</div>

<div class="badge">
📦 ${data.size_bytes} Bytes
</div>

</div>
`;

}
catch(err){

result.innerHTML =
`
<div class="result">
❌ Backend nicht erreichbar
</div>
`;
}

});
</script>

</body>
</html>
