<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIT Privacy Cleaner</title>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  let language = params.get("lang");
  try {
    if (language !== "de" && language !== "en") language = localStorage.getItem("surfsapp-language");
    if (language !== "de" && language !== "en") language = (navigator.language || "").toLowerCase().startsWith("en") ? "en" : "de";
    localStorage.setItem("surfsapp-language", language);
  } catch (_) {
    if (language !== "de" && language !== "en") language = "de";
  }
  const target = language === "en"
    ? "/Fit-Privacy-Cleaner/release-1.2.3/index.en.html"
    : "/Fit-Privacy-Cleaner/release-1.2.3/";
  location.replace(target + location.search + location.hash);
})();
</script>
</head>
<body></body>
</html>
