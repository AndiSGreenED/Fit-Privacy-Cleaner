<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Fit Privacy Cleaner</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;

    font-family:Segoe UI,sans-serif;

    background:
    linear-gradient(
    135deg,
    #0f4961,
    #2ec4c6
    );
}

.card{

    width:100%;
    max-width:1000px;

    background:white;

    border-radius:25px;

    padding:40px;

    box-shadow:
    0 20px 60px rgba(0,0,0,.2);
}

h1{

    text-align:center;

    color:#0f4961;
}

.subtitle{

    text-align:center;

    color:#64748b;

    margin-bottom:30px;
}

.dropzone{

    border:4px dashed #2ec4c6;

    border-radius:20px;

    min-height:240px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    cursor:pointer;

    background:#f8ffff;
}

.dropzone:hover{

    background:#ecfeff;
}

.info{

    margin-top:20px;

    padding:15px;

    border-radius:12px;

    background:#f8fafc;
}

.button{

    width:100%;

    margin-top:20px;

    border:none;

    border-radius:12px;

    padding:15px;

    color:white;

    background:#0f766e;

    cursor:pointer;

    font-size:16px;
}

.button:disabled{

    background:#94a3b8;

    cursor:not-allowed;
}

.result{

    margin-top:20px;

    padding:20px;

    background:#f0fdf4;

    border-radius:12px;
}

.badge{

    display:inline-block;

    margin:5px;

    padding:8px 12px;

    border-radius:20px;

    background:#ccfbf1;

    color:#0f766e;
}
</style>
</head>

<body>

<div class="card">

<h1>🏄 Fit Privacy Cleaner</h1>

<div class="subtitle">
Share your FIT files, not your private data.
</div>

<div id="dropzone" class="dropzone">

<h2>FIT-Datei hier ablegen</h2>

<p>oder klicken zum Auswählen</p>

</div>

<input
id="file"
type="file"
accept=".fit"
hidden>

<div id="info" class="info">
Noch keine Datei ausgewählt.
</div>

<button
id="analyzeBtn"
class="button"
disabled>

Analyse starten

</button>

<div id="result"></div>

</div>

<script>

const fileInput =
document.getElementById("file");

const dropzone =
document.getElementById("dropzone");

const info =
document.getElementById("info");

const result =
document.getElementById("result");

const analyzeBtn =
document.getElementById("analyzeBtn");

dropzone.onclick = () => {
    fileInput.click();
};

fileInput.addEventListener(
"change",
showFile
);

function showFile(){

    const file =
    fileInput.files[0];

    if(!file) return;

    info.innerHTML =
    `<b>${file.name}</b><br>
    ${(file.size / 1024).toFixed(1)} KB`;

    analyzeBtn.disabled = false;
}

analyzeBtn.addEventListener(
"click",
async ()=>{

    const file =
    fileInput.files[0];

    const formData =
    new FormData();

    formData.append(
        "file",
        file
    );

    try{

        const response =
        await fetch(
        "http://localhost:8000/analyze",
        {
            method:"POST",
            body:formData
        });

        const data =
        await response.json();

        result.innerHTML = `
        <div class="result">

            <h3>Analyse</h3>

            <div class="badge">
            📄 ${data.filename}
            </div>

            <div class="badge">
            📦 ${data.size_bytes}
            </div>

            <br><br>

            <div class="badge">
            ${data.gps ? "✅ GPS" : "❌ GPS"}
            </div>

            <div class="badge">
            ${data.heart_rate ? "✅ Herzfrequenz" : "❌ Herzfrequenz"}
            </div>

            <div class="badge">
            ${data.power ? "✅ Leistung" : "❌ Leistung"}
            </div>

            <div class="badge">
            ${data.cadence ? "✅ Kadenz" : "❌ Kadenz"}
            </div>

            <div class="badge">
            ${data.device_info ? "✅ Geräteinfos" : "❌ Geräteinfos"}
            </div>

        </div>
        `;

    }
    catch(err){

        result.innerHTML = `
        <div class="result">
        ❌ Backend nicht erreichbar
        </div>
        `;
    }

});
</script>

</body>
</html>
