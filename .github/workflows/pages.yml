name: Deploy FIT Cleaner website

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "browser/**"
      - "backend/FitFileProcessor.cs"
      - "tests/**"
      - "VERSION"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fit-cleaner-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore FIT smoke tests
        run: dotnet restore tests/FitPrivacyCleaner.SmokeTests.csproj
      - name: Generate browser FIT fixture
        env:
          FIT_TEST_OUTPUT_PATH: artifacts/smoke.fit
        run: |
          mkdir -p artifacts
          dotnet run --project tests/FitPrivacyCleaner.SmokeTests.csproj --configuration Release
      - name: Restore browser FIT processor
        run: dotnet restore browser/FitPrivacyCleaner.Browser.csproj
      - name: Publish browser FIT processor
        run: dotnet publish browser/FitPrivacyCleaner.Browser.csproj --configuration Release --no-restore --output artifacts/publish
      - name: Copy FIT Cleaner website into published site
        run: |
          mkdir -p artifacts/publish/wwwroot
          cp -a frontend/. artifacts/publish/wwwroot/
      - name: Inject release fallback and write live version metadata
        env:
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          DEPLOY_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          APP_VERSION="$(tr -d '[:space:]' < VERSION)"
          BUILD_SHA="${DEPLOY_COMMIT_SHA:0:7}"
          RUN_NUMBER="$DEPLOY_RUN_NUMBER"
          cat > artifacts/publish/wwwroot/version.json <<EOF
          {
            "version": "$APP_VERSION",
            "build": "$BUILD_SHA",
            "run": "$RUN_NUMBER",
            "builtAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF
          python3 - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path("artifacts/publish/wwwroot/version.json").read_text(encoding="utf-8"))
          assert metadata["version"] == Path("VERSION").read_text(encoding="utf-8").strip()
          assert len(metadata["build"]) == 7 and metadata["run"].isdigit()
          PY
          RELEASE_DIR="artifacts/publish/wwwroot/release-${APP_VERSION}"
          test -f "$RELEASE_DIR/index.html"
          test -f "$RELEASE_DIR/index.en.html"
          grep -Fq "/release-${APP_VERSION}/" artifacts/publish/wwwroot/index.html
          for PAGE in "$RELEASE_DIR/index.html" "$RELEASE_DIR/index.en.html"; do
            sed -i \
              -e "s/__APP_VERSION__/$APP_VERSION/g" \
              -e "s/__BUILD_SHA__/$BUILD_SHA/g" \
              -e "s/__RUN_NUMBER__/$RUN_NUMBER/g" \
              "$PAGE"
            if grep -Eq '__APP_VERSION__|__BUILD_SHA__|__RUN_NUMBER__' "$PAGE"; then
              echo "Deployment metadata placeholder was not replaced in $PAGE"
              exit 1
            fi
            grep -Fq "id=\"appVersion\">$APP_VERSION</span>" "$PAGE"
            grep -Fq "id=\"appBuild\">$BUILD_SHA · Run $RUN_NUMBER</span>" "$PAGE"
          done
          echo "FIT Cleaner deployment: version=$APP_VERSION build=$BUILD_SHA run=$RUN_NUMBER"
      - name: Prepare local browser test site
        run: |
          mkdir -p artifacts/testhost/Fit-Privacy-Cleaner
          cp -a artifacts/publish/wwwroot/. artifacts/testhost/Fit-Privacy-Cleaner/
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run full browser smoke test
        env:
          EXPECTED_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e
          python3 -m http.server 4173 --directory artifacts/testhost > artifacts/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/Fit-Privacy-Cleaner/ > /dev/null; then
              break
            fi
            sleep 1
          done
          EXPECTED_APP_VERSION="$(tr -d '[:space:]' < VERSION)" \
          EXPECTED_BUILD_SHA="${GITHUB_SHA:0:7}" \
          FIT_TEST_FIXTURE="$GITHUB_WORKSPACE/artifacts/smoke.fit" \
          node tests/browser-smoke.cjs
      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fit-cleaner-browser-test
          path: |
            artifacts/browser-smoke-failure.png
            artifacts/http.log
          if-no-files-found: ignore
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/publish/wwwroot
      - name: Deploy website
        id: deployment_primary
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Retry GitHub Pages deployment
        id: deployment_retry
        if: steps.deployment_primary.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify live GitHub Pages content
        env:
          PAGE_URL: ${{ steps.deployment_retry.outputs.page_url || steps.deployment_primary.outputs.page_url }}
        run: |
          set -euo pipefail
          APP_VERSION="$(tr -d '[:space:]' < VERSION)"
          BUILD_SHA="${GITHUB_SHA:0:7}"
          RUN_NUMBER="$GITHUB_RUN_NUMBER"
          BASE_URL="${PAGE_URL%/}"
          DE_URL="${BASE_URL}/release-${APP_VERSION}/"
          EN_URL="${BASE_URL}/release-${APP_VERSION}/index.en.html"
          EXPECTED_FOOTER="id=\"appVersion\">${APP_VERSION}</span> · Build <span id=\"appBuild\">${BUILD_SHA} · Run ${RUN_NUMBER}</span>"

          fetch_and_check() {
            local url="$1"
            local label="$2"
            local file="$RUNNER_TEMP/fit-cleaner-live-${label}.html"
            local code=""

            for attempt in $(seq 1 12); do
              code="$(curl -sS -L \
                -H 'Cache-Control: no-cache, no-store' \
                -H 'Pragma: no-cache' \
                -o "$file" \
                -w '%{http_code}' \
                "${url}?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}")" || code="000"

              if [ "$code" = "200" ] && grep -Fq "$EXPECTED_FOOTER" "$file"; then
                echo "$label live page verified: version=$APP_VERSION build=$BUILD_SHA run=$RUN_NUMBER"
                return 0
              fi

              echo "$label live page not current yet (HTTP $code), attempt $attempt"
              sleep 5
            done

            echo "GitHub Pages is not serving the deployment that just passed the browser test."
            echo "Expected: $EXPECTED_FOOTER"
            echo "Received footer:"
            grep -o 'FIT Privacy Cleaner · Version[^<]*<[^>]*>[^<]*</span> · Build[^<]*<[^>]*>[^<]*</span>' "$file" || head -c 1000 "$file"
            return 1
          }

          fetch_and_check "$DE_URL" "German"
          fetch_and_check "$EN_URL" "English"

          VERSION_FILE="$RUNNER_TEMP/fit-cleaner-version.json"
          curl -fsS -L \
            -H 'Cache-Control: no-cache, no-store' \
            -H 'Pragma: no-cache' \
            -o "$VERSION_FILE" \
            "${BASE_URL}/version.json?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-metadata"
          python3 - "$VERSION_FILE" "$APP_VERSION" "$BUILD_SHA" "$RUN_NUMBER" <<'PY'
          import json
          import sys
          from pathlib import Path
          metadata = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {"version": sys.argv[2], "build": sys.argv[3], "run": sys.argv[4]}
          actual = {key: metadata.get(key) for key in expected}
          if actual != expected:
              raise SystemExit(f"Live version metadata mismatch: expected {expected}, received {actual}")
          print(f"Live version.json verified: version={actual['version']} build={actual['build']} run={actual['run']}")
          PY
