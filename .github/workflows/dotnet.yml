name: Build and validate

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/FitPrivacyCleaner.csproj

      - name: Build
        run: dotnet build backend/FitPrivacyCleaner.csproj --configuration Release --no-restore

      - name: Run FIT cleaning smoke tests
        run: dotnet run --project tests/FitPrivacyCleaner.SmokeTests.csproj --configuration Release

      - name: Restore browser FIT processor
        run: dotnet restore browser/FitPrivacyCleaner.Browser.csproj

      - name: Build browser FIT processor
        run: dotnet build browser/FitPrivacyCleaner.Browser.csproj --configuration Release --no-restore
